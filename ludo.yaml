      tags:
      - Partidas
      summary: Resumo de Partidas
      description: |
        <div class="operation"><span class="get">GET</span> /partidas/resumo</div>
        Retorna um resumo das partidas do usuário
      parameters:
      - name: dt_ini
        in: query
        description: Busca Partidas com data igual ou superior a dt_ini informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: dt_fim
        in: query
        description: Busca Partidas com data inferior a dt_fim informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: id_jogo
        in: query
        description: Busca Partidas que tenham o jogo(id_jogo)
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: id_usuario_jogador
        in: query
        description: Busca Partidas que o usuário (id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: jogador
        in: query
        description: Busca Partidas que o jogador não registrado (sem id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: weekday
        in: query
        description: Dia da semana (1 Domingo a 7 Sabado)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
      responses:
        "200":
          description: |
            Resumo das partidas
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_8'
      security:
      - oauth: []
  /extra/generateimage:
    get:
      tags:
      - Extra
      summary: Imagem com Capas
      description: "<div class=\"operation\"><span class=\"get\">GET</span> /extra/generateimage</div>\nGera uma imagem com capas dos jogos passados.\nCaso sejam passadas mais de 9 imagens, apenas as 9 primeiras serão consideradas.\nO formato da imagem é baseado no número de jogos passados.: <br>\n1 jogo (1x3)<br>\n2 jogos (1x3)<br>\n<b>3 jogos (1x3)</b><br>\n<b>4 jogos (2x2)</b><br>\n5 jogos (2x3)<br>\n<b>6 jogos (2x3)</b><br>\n7 jogos (3x3)<br>\n8 jogos (3x3)<br>\n<b>9 jogos (3x3)</b><br>\nExemplo: \n<img src=\"top_nine.jpg\" class=\"top-nine\">\n"
      parameters:
      - name: jogos
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
          description: Id de jogos separados por vírgula ","
          example: 5,710,404,53,86,187,108,1860,23
      - name: cropy_cover
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          description: Indica se a imagem será cortada para manter a proporção de altura x largura.
          example: true
      responses:
        "200":
          description: Jogo
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_9'
      security:
      - oauth: []
components:
  schemas:
    Jogo:
      required:
      - id_jogo
      type: object
      properties:
        id_jogo:
          type: integer
          example: 404
        nm_jogo:
          type: string
          example: Terra Mystica
        thumb:
          type: string
          example: https://storage.googleapis.com/ludopedia-capas/404_t.jpg
        tp_jogo:
          type: string
          example: b
          enum:
          - b
          - e
        link:
          type: string
          example: https:ludopedia.com.br/jogo/terra-mystica
        ano_publicacao:
          type: integer
          example: 2012
        ano_nacional:
          type: integer
          example: 2016
        qt_jogadores_min:
          type: integer
          example: 2
        qt_jogadores_max:
          type: integer
          example: 5
        vl_tempo_jogo:
          type: integer
          example: 100
        idade_minima:
          type: integer
          example: 12
        qt_tem:
          type: integer
          example: 1500
        qt_teve:
          type: integer
          example: 1500
        qt_favorito:
          type: integer
          example: 400
        qt_quer:
          type: integer
          example: 1300
        qt_jogou:
          type: integer
          example: 707
        mecanicas:
          type: array
          items:
            $ref: '#/components/schemas/Jogo_mecanicas'
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/Jogo_categorias'
        temas:
          type: array
          items:
            $ref: '#/components/schemas/Jogo_temas'
        artistas:
          type: array
          items:
            $ref: '#/components/schemas/Jogo_artistas'
        designers:
          type: array
          items:
            $ref: '#/components/schemas/Jogo_artistas'
    Grupo:
      required:
      - id_grupo_jogo
      type: object
      properties:
        id_grupo_jogo:
          type: integer
          example: 1
        nm_grupo:
          type: string
          example: Meu Grupo
    UsuarioTag:
      required:
      - id_usuario_tag
      - nm_tag
      type: object
      properties:
        id_usuario_tag:
          type: integer
        nm_tag:
          type: string
    JogoUsuario:
      required:
      - id_jogo
      type: object
      properties:
        id_usuario_jogo:
          type: integer
          readOnly: true
        id_jogo:
          type: integer
          description: Identifador do Jogo
        nm_jogo:
          type: string
          readOnly: true
        thumb:
          type: string
          readOnly: true
        link:
          type: string
          readOnly: true
        id_usuario:
          type: integer
          readOnly: true
        fl_tem:
          type: integer
          description: Flag que indica se o jogo está na Coleção do usuário (tenho)
        fl_quer:
          type: integer
          description: Flag que indica se o jogo está na Lista de Desejos do usuário (quer)
        fl_teve:
          type: integer
          description: Flag que indica se o usuário já teve esse jogo (teve)
        fl_jogou:
          type: integer
          description: Flag que indica se o usuário já jogou esse jogo (jogou)
        comentario:
          type: string
          description: Comentário realizado pelo usuário sobre o jogo
        comentario_privado:
          type: string
          description: Comentário Privado realizado pelo usuário
        vl_nota:
          type: number
          description: Nota dada pelo usuário para o Jogo
        qt_partidas:
          type: integer
          description: Quantidade partidas registradas no site
          readOnly: true
        vl_custo:
          type: number
          description: Valor pago pelo usuário pelo jogo
        tags:
          type: array
          description: Array com Tags do usuário para esse Jogo. Adicione ou remova um objeto ao array para "Marcar" ou "Desmarcar" a Tag. Passar esse array vazio no post irá apagar todas as tags relacionadas a esse jogo.
          items:
            $ref: '#/components/schemas/JogoUsuario_tags'
    Partida:
      required:
      - descricao
      - dt_partida
      - duracao
      - expansoes
      - id_partida
      - jogadores
      - jogo
      - qt_partidas
      type: object
      properties:
        id_partida:
          type: integer
          description: Id da partida. Para cadastrar uma nova, deve vir 0.
          example: 0
        qt_partidas:
          maximum: 5
          minimum: 1
          type: integer
          description: Qtde de partidas. Geralmente é cadastrado como 1 , mas caso o usuário queira registrar + de 1 partida do mesmo jogo em um unico registro, pode utilizar esse campo.
          example: 1
          default: 1
        fl_digital:
          maximum: 1
          minimum: 0
          type: integer
          description: Flag que indica se a partida foi realizada em alguma plataforma digital(1)
          example: 0
        duracao:
          maximum: 1435
          type: integer
          description: Duração da partida, em minutos
          nullable: true
        dt_partida:
          type: string
          description: Data da Partida no formato yyyy-mm-dd
          example: 2013-06-01
        descricao:
          type: string
          description: Observações do usuário sobre a partida
          nullable: true
        grupo:
          $ref: '#/components/schemas/Grupo'
        jogo:
          $ref: '#/components/schemas/JogoResumo'
        expansoes:
          type: array
          description: Expansões do jogo utilizadas nessa partida. É obrigatório apenas o id_jogo da expansão para cadastro.
          items:
            $ref: '#/components/schemas/JogoResumo'
        jogadores:
          type: array
          description: Jogadores que participaram da partida. É necessário pelo menos 1 jogador no array.
          items:
            $ref: '#/components/schemas/Jogador'
    Jogador:
      required:
      - fl_vencedor
      - id_partida_jogador
      - id_usuario
      - nome
      - observacao
      - vl_pontos
      type: object
      properties:
        id_partida_jogador:
          type: integer
          description: Identificador do jogador na partida. Para inclusão de um novo jogador, o valor deve vir 0.
          example: 1
        nome:
          type: string
          description: Nome do jogador que não seja usuário do site. Para jogador que seja usuário do site, deve-se preenhcer o campo id_usuario.
          example: Vegeta
        id_usuario:
          type: integer
          description: Id do usuário no site. Caso esteja nulo, indica que é um Jogador que não tem cadastro e deve ser preenchido o campo nome.
          nullable: true
          example: 1
        fl_vencedor:
          maximum: 1
          minimum: 0
          type: integer
          description: |
            Flag que indica se esse jogador foi o ganhador da partida. 0 false 1 true
          nullable: false
          example: 1
        vl_pontos:
          maximum: 999
          minimum: -999
          type: integer
          nullable: true
          example: 25
        observacao:
          maximum: 100
          type: string
          description: Descrição sobre o jogador na partida (Raça escolhida, cor, estratégia, etc)
          nullable: true
        thumb:
          type: string
          description: Thumbnail do jogador no site.
          readOnly: true
    JogoResumo:
      type: object
      properties:
        id_jogo:
          type: integer
          description: Identificador do Jogo
          example: 397
        nm_jogo:
          type: string
          description: Nome do Jogo
          readOnly: true
          example: Catan o Jogo
        nm_original:
          type: string
          description: Nome Original do jogo
          readOnly: true
          example: The Settlers of Catan
        thumb:
          type: string
          description: Url da Thumbnail da capa do jogo (150x150)
          readOnly: true
          example: https://storage.googleapis.com/ludopedia-capas/397_t.jpg
        link:
          type: string
          readOnly: true
          example: https://www.ludopedia.com.br/jogo/the-settlers-of-catan
    NotaJogo:
      type: object
      properties:
        vl_nota:
          type: number
          example: 10
        comentario:
          type: string
          example: Jogo muito bom
    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
          description: Id do usuário
          example: 1
        usuario:
          type: string
          description: Nome do usuário
          example: Vegeta
        thumb:
          type: string
          description: Url para Thumb do perfil do usuário
          example: https://www.ludopedia.com.br/uploads/avatar/avatar_1_1605894422.jpg
    inline_response_200:
      type: object
      properties:
        colecao:
          type: array
          items:
            $ref: '#/components/schemas/JogoUsuario'
        qt_base:
          type: integer
          description: Total de jogos BASE da coleção
        qt_exp:
          type: integer
          description: Total de EXPANSÕES de jogo na coleção
        total:
          type: integer
          description: Total de Registros
    inline_response_200_1:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioTag'
        total:
          type: integer
          description: Total de Registros
    inline_response_200_2:
      type: object
      properties:
        colecao:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioTag'
        total:
          type: integer
    inline_response_200_3:
      type: object
      properties:
        lista:
          type: string
          example: colecao
        qtde:
          type: integer
          example: 42
    inline_response_200_4:
      type: object
      properties:
        jogos:
          type: array
          items:
            $ref: '#/components/schemas/JogoResumo'
        total:
          type: integer
          description: Total de Registros
    inline_response_200_5:
      type: object
      properties:
        notas:
          type: array
          items:
            $ref: '#/components/schemas/NotaJogo'
    inline_response_200_6:
      type: object
      properties:
        id_usuario:
          type: integer
          description: Id do usuário
          example: 1
        usuario:
          type: string
          description: Nome do usuário
          example: Vegeta
        thumb:
          type: string
          description: Url para Thumb do perfil do usuário
          example: https://www.ludopedia.com.br/uploads/avatar/avatar_1_1605894422.jpg
    inline_response_200_7:
      type: object
      properties:
        partidas:
          type: array
          items:
            $ref: '#/components/schemas/Partida'
        total:
          type: integer
          description: Total de Registros
    inline_response_200_8:
      type: object
      properties:
        qt_partidas:
          type: integer
          description: Quantidade de partidas
          example: 10
        vl_duracao:
          type: integer
          description: Duracao registrada das partidas, em minutos
          example: 120
        qt_duracao:
          type: integer
          description: Quantidade de Partidas que possuem duracao cadastrada
          example: 2
        qt_jogos:
          type: integer
          description: Quantidade de Jogos Únicos usados em partidas
          example: 5
        qt_expansoes:
          type: integer
          description: Quantidade de Expansões Únicas usadas em partidas
          example: 2
        qt_vitorias:
          type: integer
          description: Quantidade de Partidas que o usuário venceu
          example: 5
        qt_usuarios:
          type: integer
          description: Quantidade de Usuários do site registrados nas partidas (o próprio usuário também consta na quantidade)
          example: 2
        qt_nao_usuarios:
          type: integer
          description: Quantidade de Jogadores únicos não registrados no site
          example: 3
    inline_response_200_9:
      type: object
      properties:
        height:
          type: integer
          description: Altura da imagem gerada
          example: 1080
        width:
          type: integer
          description: Largura da imagem gerada
          example: 1080
        imagem:
          type: string
          description: Imagem PNG em string Base 64
    Jogo_mecanicas:
      type: object
      properties:
        id_mecanica:
          type: integer
        nm_mecanica:
          type: string
    Jogo_categorias:
      type: object
      properties:
        id_categoria:
          type: integer
        nm_categoria:
          type: string
    Jogo_temas:
      type: object
      properties:
        id_tema:
          type: integer
        nm_tema:
          type: string
    Jogo_artistas:
      type: object
      properties:
        id_profissional:
          type: integer
        nm_profissional:
          type: string
    JogoUsuario_tags:
      type: object
      properties:
        id_usuario_tag:
          type: integer
        nm_tag:
          type: string
          readOnly: true
  parameters:
    pageParam:
      name: page
      in: query
      description: Pagina atual
      required: false
      style: form
      explode: true
      schema:
        type: integer
        default: 1
    rowsParam:
      name: rows
      in: query
      description: Quantidade de Registros a retornar (máximo 100)
      required: false
      style: form
      explode: true
      schema:
        maximum: 100
        minimum: 1
        type: integer
        default: 20
    idJogoParam:
      name: id_jogo
      in: path
      description: Id do jogo
      required: true
      style: simple
      explode: false
      schema:
        type: integer
  requestBodies:
    UsuarioTagBody:
      description: Objeto de Tag do Usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsuarioTag'
      required: true
    JogoUsuarioBody:
      description: Objeto Jogo Usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JogoUsuario'
      required: true
    PartidaBody:
      description: Objeto Partida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Partida'
      required: true
    JogoBody:
      description: Login de usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Jogo'
      required: true
  securitySchemes:
    oauth:
      type: oauth2
      description: Urls de Autorização e Token
      flows:
        authorizationCode:
          authorizationUrl: https://ludopedia.com.br/oauth
          tokenUrl: https://ludopedia.com.br/tokenrequest
          scopes:
            usuarios:read: Ler dados de Usuário
            usuarios:write: Alterar dados de Usuário
