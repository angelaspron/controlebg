---
openapi: 3.0.0
info:
  title: LudoAPI
  description: "# Introdução\n  Essa API é documentada no formato \"OpenAPI(3.0) e fornece meios para acessar dados do site [Ludopedia](https://ludopedia.com.br) através de uma autenticação [OAUTH 2.0](https://oauth.net/2/). As Urls de autenticação podem ser encontradas na seção Authentication.\n  \n  A API se encontra em estágio ALPHA, por isso está em constante atualização. Caso tenha alguma dúvida sobre a utilização da API, tenha encontrado bugs ou tenha sugestões, por favor entre em contato através do e-mail api@ludopedia.com.br\n   \n# Aplicativo\n  Para iniciar a utilização da API, é necessário cadastrar um aplicativo na Ludopedia. Através do link [https://ludopedia.com.br/aplicativos](https://ludopedia.com.br/aplicativos) você consegue ver os seus aplicativos atuais e criar um novo Aplicativo.\n  \n  Ao criar um aplicativo, será gerado um  ``` app_id ``` , um ``` app_key ``` e um ``` access_token ```.  O ``` app_id ``` e o ``` app_key ``` serão utilizados pela sua aplicação para conseguir um ``` acces_token ``` de usuário.\n  \n  O ```access_token``` gerado automaticamente, corresponde a um token para acesso a dados do próprio usuário dono do aplicativo. \n\n# Adquirindo um access_token\n  Para adquirir um ```access_token```, você deve direcionar o usuário (através de um botão ou link) para nossa url de autorização (https://ludopedia.com.br/oauth), passando os parametros ``` app_id ``` e ``` redirect_uri ```. A redirect_uri deve estar previamente cadastrada no Aplicativo [https://ludopedia.com.br/aplicativos](https://ludopedia.com.br/aplicativos) .\n  \n  <pre><code> https://ludopedia.com.br/oauth?app_id=seu_app_id&redirect_uri=seu_servidor_de_retorno</code></pre>\n\n  O Usuário será redirecionado para a Ludopedia onde ele poderá <b class=\"teste\">Aprovar</b> ou <b>Negar</b> o acesso do aplicativo a seus dados.\n  \n  \n  Após a seleção do usuário, a Ludopedia realizará um **redirecionamento** para sua ```redirect_uri```. Caso o usuário tenha **Aprovado** o acesso, será enviado um parametro ```code``` que pode ser trocado por um ```access_token``` de usuário. Caso tenha sido **Negado** ou tenha ocorrido um **Erro**, serão enviados os parametros ```error``` e ```error_description```.\n  \n  Com o <code>code</code> a aplicação deve realizar um <b>POST</b> em nossa url de token (https://ludopedia.com.br/tokenrequest) informando o Parametro <code>code</code>. Como resposta recebera um objeto json como <code>access_token</code> de usuário.\n  \n# Consumindo Métodos da API\n  Para consumir métodos da API é necessário sempre informar um <code>access_token</code> no header <b>AUTHORIZATION</b>.\n  <table class=\"table-authorization\">\n    <thead>\n      <tr>\n        <th>Key</th>\n        <th>Value</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr><td>Authorization</td><td>Bearer <code>access_token</code></td>\n    </tbody>\n  </table>\n"
  contact:
    email: api@ludopedia.com.br
  version: 0.0.5
  x-logo:
    url: https://www.ludopedia.com.br/images/brand.svg
    altText: Ludopedia logo
servers:
- url: https://ludopedia.com.br/api/v1
  description: LudoAPI
tags:
- name: Jogos
  description: Operações referente a ficha de jogos
- name: Usuários
  description: Operações referente a usuários
- name: Coleção
  description: Operações referente a coleção de usuários
- name: Partidas
  description: Operações referente ao registro de Partidas
- name: Extra
  description: Operações diversas
paths:
  /colecao:
    description: Coleção do usuário
    get:
      tags:
      - Coleção
      summary: Listar Coleção
      description: |
        <div class="operation"><span class="get">GET</span> /colecao</div>

        Retorna a lista de jogos da Coleção do usuário. Através desse método pode ser retornado

        ```colecao``` Retorna os jogos da coleção do usuário

        ```lista_desejos``` Retona a lista de desejos

        ```favoritos``` Retorna os jogos favoritos

        ```teve``` Retonar os jogos que o usuário já teve

        ```notas``` Retonar os jogos que o usuário já deu nota

        ```comentários``` Retonar os jogos que o usuário já preencheu um comentário
      parameters:
      - name: lista
        in: query
        description: Indica qual lista da coleção do usuário irá buscar
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - colecao
          - favoritos
          - teve
          - lista_desejos
          - comentados
          - notas
          - jogados
      - name: search
        in: query
        description: Realiza uma busca na coleção atual pelo nome do jogo
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: ordem
        in: query
        description: Ordenação dos resultado por Nome do jogo, Ranking, Nota do Usuário ou Quantidade de Partidas registradas.  Por padrão, vem ordenado por nome do jogo.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - nome
          - rank
          - nota
          - partidas
      - name: tp_jogo
        in: query
        description: Filtra o resultado pelo tipo de jogo. ```t``` = todos, ```b``` = jogo base, ```e``` = expansão
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - t
          - b
          - e
      - name: qt_jogadores
        in: query
        description: Filtra o resultado para jogos que aceitem essa quantidade de jogadores.
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: Lista de Jogos
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
      security:
      - oauth: []
    post:
      tags:
      - Coleção
      summary: Inserir/Alterar na Coleção
      description: |
        <div class="operation"><span class="post">POST</span> /colecao</div>
        Para inserir ou alterar dados da relação de um jogo/usuário, é necessário fazer um <b>POST </b> com o objeto <code>JogoUsuario</code><br><br>
        Antes de realizar o <b>POST</b> você deve realizar o um <b>GET</b> do Objeto através do endpoint <code>colecao/item/{id_jogo}</code> para trazer os dados atualizados e alterar o que deseja.<br><br>
        Você pode adicionar um jogo na Coleção alterando a Flag dele de 0 para 1 no objeto JogoUsuario : <br><br>
      requestBody:
        $ref: '#/components/requestBodies/JogoUsuarioBody'
      responses:
        "200":
          description: Jogo Usuario Atualizado
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/JogoUsuario'
  /colecao/item/{id_jogo}:
    get:
      tags:
      - Coleção
      summary: Usuário Jogo
      description: |
        <div class="operation"><span class="get">GET</span> /colecao/item/{<span class="param">id_jogo</span>}</div>
        Retorna a relação do usuário com o jogo (Nota, Comentario, coleção, etc)
      parameters:
      - name: id_jogo
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Jogo
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/JogoUsuario'
      security:
      - oauth: []
  /colecao/tags:
    get:
      tags:
      - Coleção
      summary: Tags do usuário
      description: |
        <div class="operation"><span class="get">GET</span> /colecao/tags</div>
        Listar Tags do usuário
      parameters:
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: Lista de tags
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_1'
    post:
      tags:
      - Coleção
      summary: Inserir/Atualizar Tag
      description: |
        <div class="operation"><span class="post">POST</span> /colecao/tags</div>
        Permite a criação de uma nova tag, ou a atualização de uma tag Existente.
        Para a criação de uma tag, pode-se passar o id_usuario_tag com valor <b>0</b>
      requestBody:
        $ref: '#/components/requestBodies/UsuarioTagBody'
      responses:
        "200":
          description: Objeto UsuarioTag
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_2'
  /colecao/tags/{id_usuario_tag}:
    delete:
      tags:
      - Coleção
      summary: Deletar Tag
      description: |
        <div class="operation"><span class="delete">DELETE</span> /colecao/tags/{<span class="param">id_usuario_tag</span>}</div>
        Deletar Tag de Usuário a partir do id_usuario_tag
      parameters:
      - name: id_usuario_tag
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Retorna Null se o objeto foi deletado
      security:
      - oauth: []
  /colecao/count:
    get:
      tags:
      - Coleção
      summary: Contabilizar Coleção
      description: |
        <div class="operation"><span class="get">GET</span> /colecao/count</div>
        Contabilizar Coleção
      responses:
        "200":
          description: Listas e Quantidades
          content:
            aplication-json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/inline_response_200_3'
      security:
      - oauth: []
  /colecao/group:
    description: Coleção do usuário
    get:
      tags:
      - Coleção
      summary: Agrupar Coleção
      description: "<div class=\"operation\"><span class=\"get\">GET</span> /colecao/group</div>\nRetorna os itens da coleção do usuário agrupados. É possível trazer multiplos agrupamentos em uma única chamada, separando os agrupamentos por | no parametro ``groupby``\n\nAgrupamentos possíveis : \n\n ```tags``` Retorna a quantidade de jogos agrupados pelas Tags do usuário\n\n```jogadores``` Retorna a quantidade de jogos agrupados pelo número de jogadores possíveis cadastrada na ficha do jogo\n\n```mecanicas``` Retorna a quantidade de jogos agrupadas pelas Mecânicas do jogo\n\n```temas``` Retorna a quantidade de jogos agrupadas pelos Temas do jogo\n"
      parameters:
      - name: lista
        in: query
        description: Indica qual lista da coleção do usuário irá buscar
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - colecao
          - favoritos
          - teve
          - lista_desejos
          - comentados
          - notas
          - jogados
      - name: groupby
        in: query
        description: Agrupamentos desejados, separados por |
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: mecanicas|temas|tags
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: "Retorna um Objeto com os arrays dos grupos solicitados.\n\n  Exemplo : groupby=temas|mecanicas\n  \n  Retorno : <code>\n            { \n              temas:[], \n              mecanicas:[]\n            }\n            </code>\n"
          content:
            aplication-json:
              schema:
                type: object
      security:
      - oauth: []
  /jogos:
    description: Retorna uma lista de jogos, de acordo com os parametros passados.
    get:
      tags:
      - Jogos
      summary: Listar Jogos
      description: |
        <div class="operation "><span class="get">GET</span> /jogos</div>
        Retorna uma lista de jogos, de acordo com os parametros passados.
      parameters:
      - name: search
        in: query
        description: Pesquisa pelo nome do jogo
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: tp_jogo
        in: query
        description: Filtra o resultado pelo tipo de jogo. ``` ``` = todos, ```b``` = jogo base, ```e``` = expansão
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: ""
          enum:
          - ""
          - b
          - e
      - name: id_jogo_base
        in: query
        description: Indica para trazer apenas jogos que sejam <b>expansão</b> do jogo base indicado por id_jogo_base
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: Lista de Jogos
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_4'
      security:
      - oauth: []
  /jogos/{id_jogo}:
    get:
      tags:
      - Jogos
      summary: Detalhes de um jogo
      description: |
        <div class="operation"><span class="get">GET</span> /jogos/{<span class="param">id_jogo</span>}</div>
        Retorna os detalhes da Ficha do jogo
      parameters:
      - name: id_jogo
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Jogo
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/Jogo'
      security:
      - oauth: []
  /jogos/{id_jogo}/notas:
    get:
      tags:
      - Jogos
      summary: Comentários e notas (não implementado)
      description: |
        <div class="operation"><span class="get">GET</span> /jogos{<span class="param">id_jogo</span>}/notas</div>
        Retorna os Comentários e notas de um jogo
      parameters:
      - name: id_jogo
        in: path
        description: Id do jogo
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Notas
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
      security:
      - oauth: []
  /jogos/{id_jogo}/videos:
    get:
      tags:
      - Jogos
      summary: Retorna a lista de videos de um jogo (não implementado)
      description: |
        <div class="operation"><span class="get">GET</span> /jogos{<span class="param">id_jogo</span>}/videos</div>
        Retorna a lista de videos de um jogo (não implementado)
      parameters:
      - name: id_jogo
        in: path
        description: Id do jogo
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Vídeos
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
      security:
      - oauth: []
  /jogos/{id_jogo}/imagens:
    get:
      tags:
      - Jogos
      summary: Retorna a lista de Imagens de um jogo (Não implementado)
      description: |
        <div class="operation"><span class="get">GET</span> /jogos{<span class="param">id_jogo</span>}/imagens</div>
        Retorna a lista de Imagens de um jogo (não implementado)
      parameters:
      - name: id_jogo
        in: path
        description: Id do jogo
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Imagens
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
      security:
      - oauth: []
  /jogos/{id_jogo}/aquivos:
    get:
      tags:
      - Jogos
      summary: Retorna a lista de Arquivos de um jogo (Não Implementado)
      description: |
        <div class="operation"><span class="get">GET</span> /jogos{<span class="param">id_jogo</span>}/arquivos</div>
        Retorna a lista de arquivos de um jogo (não implementado)
      parameters:
      - name: id_jogo
        in: path
        description: Id do jogo
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Arquivos
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
      security:
      - oauth: []
  /me:
    get:
      tags:
      - Usuários
      summary: Dados do usuário Logado
      description: |
        <div class="operation"><span class="get">GET</span> /me</div>
        Retorna dados do usuário Logado
      responses:
        "200":
          description: Dados do usuário Logado
          content:
            application-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_6'
  /usuarios:
    get:
      tags:
      - Usuários
      summary: Listar Usuários
      description: |
        <div class="operation"><span class="get">GET</span> /usuarios</div>
        Retorna uma lista de usuários, baseado nos parametros de Pesquisa
      parameters:
      - name: search
        in: query
        description: String para pesquisa de usuários
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: page
        in: query
        description: Pagina atual da pesquisa
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      responses:
        "200":
          description: Lista de Usuários
          content:
            aplication-json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
      security:
      - oauth: []
  /partidas:
    get:
      tags:
      - Partidas
      summary: Listar Partidas
      description: |
        <div class="operation"><span class="get">GET</span> /partidas</div>
        Retorna a lista de Partidas do usuário
      parameters:
      - name: dt_ini
        in: query
        description: Busca Partidas com data igual ou superior a dt_ini informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: dt_fim
        in: query
        description: Busca Partidas com data inferior a dt_fim informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: id_jogo
        in: query
        description: Busca Partidas que tenham o jogo(id_jogo)
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: id_usuario_jogador
        in: query
        description: Busca Partidas que o usuário (id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: jogador
        in: query
        description: Busca Partidas que o jogador não registrado (sem id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: weekday
        in: query
        description: Dia da semana (1 Domingo a 7 Sabado)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: Lista de Partidas do usuário
          content:
            aplication-json:
              schema:
                $ref: '#/components/schemas/inline_response_200_7'
      security:
      - oauth: []
    post:
      tags:
      - Partidas
      summary: Inserir/Alterar Partida
      description: |
        <div class="operation"><span class="post">POST</span> /partidas</div>
        Cadastra ou altera uma partida. Para cadastrar o objeto deve ter o id_partida = 0 . Para fazer update, deve-se passar o id_partida e a partida deve ter sido criada pelo próprio usuário.
        O usuário deve fazer parte do array <code>Jogadores</code>. O <code>id_usuario</code> do usuário logado pode ser obtido através do método <code>/me</code>
      requestBody:
        $ref: '#/components/requestBodies/PartidaBody'
      responses:
        "200":
          description: Partida
  /partidas/{id_partida}:
    get:
      tags:
      - Partidas
      summary: Retornar Dados de uma Partida
      description: |
        <div class="operation"><span class="get">GET</span> /partidas/{<span class="param">id_partida</span>}</div>
        Retorna detalhes da Partida
      parameters:
      - name: id_partida
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Partida
          content:
            aplication-json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partida'
      security:
      - oauth: []
    delete:
      tags:
      - Partidas
      summary: Deletar Partida
      description: |
        <div class="operation"><span class="delete">DELETE</span> /partidas/{<span class="param">id_partida</span>}</div>
        Deletar a partida. Apenas usuário que registrou a partida tem permissão de exclui-la
      parameters:
      - name: id_partida
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
      responses:
        "200":
          description: Retorna Null se o objeto foi deletado
      security:
      - oauth: []
  /partidas/group:
    get:
      tags:
      - Partidas
      summary: Agrupar Partidas
      description: "<div class=\"operation\"><span class=\"get\">GET</span> /partidas/group</div>\nRetorna as partidas agrupadas. É possível trazer multiplos agrupamentos em uma única chamada, separando os agrupamentos por | no parametro ``groupby``\n\nAgrupamentos possíveis : \n\n ```jogos``` Retorna partidas agrupadas por jogo<br>\n```jogadores``` Retorna partidas agrupadas por jogadores<br>\n```qt_jogadores``` Retorna partidas agrupadas por qtde de jogadores<br>\n```expansoes``` Retorna partidas agrupadas por expansão<br>\n```diasemana``` Retorna partidas agrupadas por dia da semana<br>\n```grupos``` Retorna partidas agrupas por Grupo de Usuários<br>\n"
      parameters:
      - name: groupby
        in: query
        description: Agrupamentos desejados, separados por |
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: jogos|jogadores
      - name: dt_ini
        in: query
        description: Busca Partidas com data igual ou superior a dt_ini informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: dt_fim
        in: query
        description: Busca Partidas com data inferior a dt_fim informada no formato <b>yyyy-mm-dd</b>
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: id_jogo
        in: query
        description: Busca Partidas que tenham o jogo(id_jogo)
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: id_usuario_jogador
        in: query
        description: Busca Partidas que o usuário (id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: jogador
        in: query
        description: Busca Partidas que o jogador não registrado (sem id_usuario) tenha participado
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: weekday
        in: query
        description: Dia da semana (1 Domingo a 7 Sabado)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
      - name: order
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: Ordenação
          default: qtde
          enum:
          - qtde
          - dt_ultima_partida
          - duracao
      - name: page
        in: query
        description: Pagina atual
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: rows
        in: query
        description: Quantidade de Registros a retornar (máximo 100)
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      responses:
        "200":
          description: "Retorna um Objeto com os arrays dos grupos solicitados.\n\n  Exemplo : groupby=temas|mecanicas\n  \n  Retorno : {jogos:[], jogadores:[]}\n"
          content:
            aplication-json:
              schema:
                type: object
      security:
      - oauth: []
  /partidas/resumo:
