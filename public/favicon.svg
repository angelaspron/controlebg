<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="meeple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="meeple-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Meeple silhouette -->
  <path 
    d="M 50 5 C 40 5, 35 25, 42 32 L 15 32 C 5 32, 5 50, 15 50 L 32 55 L 25 95 C 23 100, 42 100, 42 95 L 50 70 L 58 95 C 58 100, 77 100, 75 95 L 68 55 L 85 50 C 95 50, 95 32, 85 32 L 58 32 C 65 25, 60 5, 50 5 Z" 
    fill="url(#meeple-gradient)"
    stroke="rgba(255, 255, 255, 0.3)"
    stroke-width="1.8"
    filter="url(#shadow)"
  />
  <!-- Subtle highlight on head for depth -->
  <ellipse cx="49" cy="18" rx="8" ry="6" fill="url(#meeple-highlight)" />
</svg>